services:
    piped-frontend:
        image: ghcr.io/noahbroyles/piped-frontend:latest
        restart: unless-stopped
        depends_on:
            - piped
        environment:
            BACKEND_HOSTNAME: BACKEND_HOSTNAME_PLACEHOLDER
            HTTP_MODE: HTTP_MODE_PLACEHOLDER
        container_name: piped-frontend
    piped-proxy:
        image: ghcr.io/noahbroyles/piped-proxy:latest
        restart: unless-stopped
        environment:
            - UDS=1
            # Public URL of the proxy, which SABR redirects are pointed back at
            - PROXY_PUBLIC_URL=HTTP_MODE_PLACEHOLDER://PROXY_HOSTNAME_PLACEHOLDER
        volumes:
            - piped-proxy:/app/socket
        container_name: piped-proxy
    piped:
        image: ghcr.io/noahbroyles/piped-backend:latest
        restart: unless-stopped
        volumes:
            - ./config/config.properties:/app/config.properties:ro
        depends_on:
            - postgres
        container_name: piped-backend
    bg-helper:
        image: ghcr.io/noahbroyles/bg-helper-server:latest
        restart: unless-stopped
        container_name: piped-bg-helper
    piped-player-n-decoder:
        image: ghcr.io/noahbroyles/piped-player-n-decoder:latest
        restart: unless-stopped
        # Runs code from YouTube's player, so it gets nothing it doesn't need
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        container_name: piped-player-n-decoder
    nginx:
        image: nginx:mainline-alpine
        restart: unless-stopped
        volumes:
            - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./config/pipedapi.conf:/etc/nginx/conf.d/pipedapi.conf:ro
        container_name: nginx
        depends_on:
            - piped
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - piped-proxy:/var/run/ytproxy
        container_name: caddy
    postgres:
        image: pgautoupgrade/pgautoupgrade:16-alpine
        restart: unless-stopped
        volumes:
            - ./data/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_DB=piped
            - POSTGRES_USER=piped
            - POSTGRES_PASSWORD=changeme
        container_name: postgres
    # BEGIN watchtower: automatic image updates. configure-instance.sh deletes everything
    # from here to "END watchtower" when automatic updates are turned off.
    watchtower:
        image: nickfedor/watchtower
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /etc/timezone:/etc/timezone:ro
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_INCLUDE_RESTARTING=true
        container_name: watchtower
        command: piped-frontend piped-backend piped-proxy piped-bg-helper piped-player-n-decoder nginx caddy postgres watchtower
    # END watchtower
volumes:
    caddy_data: null
    piped-proxy: null
